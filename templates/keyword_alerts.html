{% extends 'base.html' %}

{% block content %}
<h1>キーワードアラート設定</h1>

<div class="keyword-alert-form">
    <form method="post">
        {% csrf_token %}
        <input type="text" name="keyword" placeholder="キーワードを入力" required>
        <button type="submit">追加</button>
    </form>
</div>

<div class="keyword-alerts-list">
    <h2>設定済みキーワード</h2>
    {% if alerts %}
    <ul>
        {% for alert in alerts %}
        <li>
            {{ alert.keyword }}
            <a href="{% url 'delete_keyword_alert' alert.id %}">削除</a>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>キーワードが設定されていません</p>
    {% endif %}
</div>

<div class="actions">
    <a href="{% url 'check_keyword_alerts' %}">キーワードを含むメールを検索</a> |
    <a href="{% url 'dashboard' %}">ダッシュボードに戻る</a>
</div>
{% endblock %}
